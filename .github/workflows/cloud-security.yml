name: Cloud security verification
on:
  push:
    branches: [security/cloud-hardening]
  pull_request:
  workflow_dispatch:
    inputs:
      open_access:
        description: Run the isolated public PLOS download check
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Build disposable test image (no credentials or host mounts)
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        shell: bash
        run: |
          context=$(mktemp -d)
          git archive HEAD | tar -x -C "$context"
          cat > "$context/Dockerfile" <<'DOCKERFILE'
          ARG PYTHON_VERSION=3.12
          FROM python:${PYTHON_VERSION}-slim
          RUN python -m pip install --no-cache-dir uv==0.13.5
          WORKDIR /work
          COPY . .
          ENV HOME=/tmp/empty-home PYTHONPATH=/work
          RUN mkdir -p /tmp/empty-home
          RUN uv run --locked python -c "pass"
          RUN uv run --frozen --with ruff --with pip-audit python -c "pass"
          DOCKERFILE
          docker build --build-arg PYTHON_VERSION="$PYTHON_VERSION" --tag doifetch-security "$context"
      - name: Formatting and focused lint checks
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges doifetch-security uv run --offline --frozen --with ruff --with pip-audit ruff format --check fetch_crossref.py fetch_ezproxy.py fetch_hal.py fetch_istex.py fetch_libgen.py fetch_scihub.py fetch_unpaywall.py fetch_url.py safe_http.py pdf_utils.py tests/test_fetch_ezproxy.py tests/test_fetch_scihub.py tests/test_fetch_istex.py tests/conftest.py tests/test_security.py tests/cloud_open_access.py tests/test_network.py
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges doifetch-security uv run --offline --frozen --with ruff --with pip-audit ruff check --select E4,E7,E9,F fetch_crossref.py fetch_ezproxy.py fetch_hal.py fetch_istex.py fetch_libgen.py fetch_scihub.py fetch_unpaywall.py fetch_url.py safe_http.py pdf_utils.py tests/test_fetch_ezproxy.py tests/test_fetch_scihub.py tests/test_fetch_istex.py tests/conftest.py tests/test_security.py tests/cloud_open_access.py tests/test_network.py
      - name: Offline tests (network disabled)
        run: >
          docker run --rm --network none --cap-drop ALL
          --security-opt no-new-privileges --pids-limit 128 --memory 2g
          doifetch-security
          uv run --offline --frozen pytest -q -m "not network" --ignore=tests/test_network.py
      - name: Audit all resolved dependency versions
        if: matrix.python == '3.12'
        run: |
          docker run --rm --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 2g doifetch-security sh -ec '
            uv run --offline --frozen python -c "import tomllib; d=tomllib.load(open(\"uv.lock\",\"rb\")); print(\"\\n\".join(p[\"name\"]+\"==\"+p[\"version\"] for p in d[\"package\"] if \"virtual\" not in p.get(\"source\",{})))" > /tmp/requirements.txt
            cat /tmp/requirements.txt
            awk -F== "!seen[\$1]++" /tmp/requirements.txt > /tmp/primary.txt
            awk -F== "seen[\$1]++" /tmp/requirements.txt > /tmp/alternatives.txt
            uv run --offline --frozen --with ruff --with pip-audit pip-audit --no-deps --disable-pip -r /tmp/primary.txt
            uv run --offline --frozen --with ruff --with pip-audit pip-audit --no-deps --disable-pip -r /tmp/alternatives.txt
          '
  windows-offline:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare disposable runner dependencies
        shell: pwsh
        run: |
          python -m pip install uv==0.13.5
          uv run --locked python -c "pass"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: All offline tests with isolated home and blocked Python egress
        shell: pwsh
        run: |
          $testHome = Join-Path $env:RUNNER_TEMP "doifetch-empty-home"
          New-Item -ItemType Directory -Force $testHome | Out-Null
          $env:HOME = $testHome
          $env:USERPROFILE = $testHome
          "EZPROXY_BASE","EZPROXY_COOKIES","ISTEX_ACCESSTOKEN","ZOTERO_DB_PATH","ZOTERO_DATA_DIR" | ForEach-Object { Remove-Item "Env:$_" -ErrorAction SilentlyContinue }
          $pythonPath = (uv run --offline --frozen python -c "import sys; print(sys.executable)").Trim()
          New-NetFirewallRule -DisplayName "DOIfetch offline Python" -Direction Outbound -Program $pythonPath -Action Block | Out-Null
          try {
            uv run --offline --frozen pytest -q -m "not network" --ignore=tests/test_network.py --junitxml=windows-results.xml
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } finally {
            Remove-NetFirewallRule -DisplayName "DOIfetch offline Python"
          }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: windows-results-${{ matrix.os }}-py${{ matrix.python }}
          path: windows-results.xml
  codeql:
    permissions:
      contents: read
      security-events: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          languages: python
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          upload: false
          output: codeql-results
      - name: Report Security Extended results
        run: |
          jq '[.runs[].results[] | {ruleId, message, locations}]' codeql-results/python.sarif
          jq -e '[.runs[].results[]] | length == 0' codeql-results/python.sarif
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: codeql-security-extended
          path: codeql-results/*.sarif
  open-access:
    needs: [offline, codeql]
    if: >-
      contains(github.event.head_commit.message, '[open-access-check]') ||
      (github.event_name == 'workflow_dispatch' && inputs.open_access)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Build a new disposable image
        env:
          PYTHON_VERSION: "3.12"
        shell: bash
        run: |
          context=$(mktemp -d)
          git archive HEAD | tar -x -C "$context"
          cat > "$context/Dockerfile" <<'DOCKERFILE'
          ARG PYTHON_VERSION=3.12
          FROM python:${PYTHON_VERSION}-slim
          RUN python -m pip install --no-cache-dir uv==0.13.5
          WORKDIR /work
          COPY . .
          ENV HOME=/tmp/empty-home PYTHONPATH=/work
          RUN mkdir -p /tmp/empty-home
          RUN uv run --locked python -c "pass"
          RUN uv run --frozen --with ruff --with pip-audit python -c "pass"
          DOCKERFILE
          docker build --build-arg PYTHON_VERSION="$PYTHON_VERSION" --tag doifetch-security "$context"
      - name: One public download; raw-byte identity, size and SHA-256 checks
        shell: bash
        run: |
          docker run --rm --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 2g doifetch-security uv run --offline --frozen python tests/cloud_open_access.py | tee open-access-report.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: open-access-report
          path: open-access-report.json
